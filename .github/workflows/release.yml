name: Release on Version Bump

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Version header is new
        id: ver
        run: |
          VERSION=$(grep -oE 'Version:\s*[0-9]+(\.[0-9]+)+' bloqueo-admin-pais.php | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+')
          if [ -z "$VERSION" ]; then
            echo "No valid Version header found in bloqueo-admin-pais.php"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version $TAG detected! Preparing release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Build clean plugin ZIP
        if: steps.ver.outputs.should_release == 'true'
        run: |
          mkdir -p build/bloqueo-admin-pais
          rsync -av --exclude='build' --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude-from='.gitignore' ./ build/bloqueo-admin-pais/
          cd build && zip -r ../bloqueo-admin-pais.zip bloqueo-admin-pais

      - name: Create GitHub Release
        if: steps.ver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Release ${{ steps.ver.outputs.tag }}"
          body: "${{ github.event.head_commit.message }}"
          files: bloqueo-admin-pais.zip
